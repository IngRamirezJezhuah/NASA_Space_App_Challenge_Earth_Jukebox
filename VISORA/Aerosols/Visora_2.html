<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visora · Aerosoles</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
    /* =========================================================================
       VISORA · lenguaje visual
       Sobrio: negro, blanco y una sola tipografía. Sin colores de neón; el único
       color que aparece es el del gas que señala el cursor. Todo lo que no estés
       usando se desvanece solo para dejar ver el planeta.
       ========================================================================= */
    :root{
      --fg:#fff;
      --t1:rgba(255,255,255,.92);   /* texto principal  */
      --t2:rgba(255,255,255,.55);   /* texto secundario */
      --t3:rgba(255,255,255,.30);   /* apenas visible   */
      --line:rgba(255,255,255,.14);
      --line2:rgba(255,255,255,.26);
      --panel:rgba(8,9,11,.72);
      --mono:'JetBrains Mono',ui-monospace,'Courier New',monospace;
    }
    html,body{margin:0;height:100%;overflow:hidden;background:#000;
              font-family:var(--mono);color:var(--t1);
              -webkit-font-smoothing:antialiased}
    canvas{display:block;cursor:grab}
    canvas:active{cursor:grabbing}

    /* --- piezas comunes --- */
    .v-panel{background:var(--panel);border:1px solid var(--line);
             backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
    .v-lbl{font:400 10px/1.5 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--t2)}
    .v-btn{font:400 10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;
           color:var(--t2);background:transparent;border:1px solid var(--line);
           padding:9px 14px;cursor:pointer;transition:color .25s,border-color .25s}
    .v-btn:hover{color:var(--fg);border-color:var(--line2)}
    .v-btn.on{color:var(--fg);border-color:var(--fg)}
    /* se apaga solo cuando nadie toca nada */
    .v-fade{transition:opacity .7s ease}
    body.idle .v-fade{opacity:0;pointer-events:none}

    /* --- barra inferior: reproducción --- */
    #v-play{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:10;
            display:flex;align-items:center;gap:14px;padding:9px 14px}
    #v-play .sep{width:1px;height:14px;background:var(--line)}
    #v-time{font:400 10px var(--mono);letter-spacing:.1em;color:var(--t2);min-width:92px;text-align:center}
    #v-time b{color:var(--t1);font-weight:400}
    #v-scrub{-webkit-appearance:none;appearance:none;width:190px;height:14px;background:transparent;cursor:pointer}
    #v-scrub::-webkit-slider-runnable-track{height:1px;background:var(--line2)}
    #v-scrub::-webkit-slider-thumb{-webkit-appearance:none;width:9px;height:9px;border-radius:50%;
            background:var(--fg);margin-top:-4px}
    #v-scrub::-moz-range-track{height:1px;background:var(--line2)}
    #v-scrub::-moz-range-thumb{width:9px;height:9px;border:0;border-radius:50%;background:var(--fg)}
    #v-icon{width:11px;height:11px;display:block}

    /* --- esquina superior izquierda: ajustes de fondo --- */
    #v-top{position:fixed;left:18px;top:16px;z-index:10;display:flex;align-items:center;gap:10px}
    #v-top select{font:400 10px var(--mono);letter-spacing:.12em;color:var(--t2);background:var(--panel);
                  border:1px solid var(--line);padding:7px 9px;cursor:pointer;outline:none;
                  -webkit-appearance:none;appearance:none;text-transform:uppercase}
    #v-top select:hover{color:var(--fg);border-color:var(--line2)}
    #v-top input[type=file]{display:none}

    /* --- aviso de carga --- */
    #v-buf{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:9;
           font:300 10px var(--mono);letter-spacing:.3em;text-transform:uppercase;color:var(--t3);
           opacity:0;transition:opacity .4s;pointer-events:none}
    #v-buf.on{opacity:1}

    /* --- cursor central (crosshair.js) --- */
    #vx{position:fixed;left:50%;top:50%;width:116px;height:116px;margin:-58px 0 0 -58px;z-index:8;
        pointer-events:none;opacity:.85}
    #vx-info{position:fixed;left:calc(50% + 72px);top:calc(50% - 24px);z-index:8;pointer-events:none;
             transition:opacity .4s}
    #vx-info .gas{font:400 11px/1.4 var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--t1)}
    #vx-info .pos{font:300 9px/1.6 var(--mono);letter-spacing:.14em;color:var(--t3)}
    #vx-bar{width:86px;height:1px;background:var(--line2);margin:7px 0 5px;position:relative}
    #vx-bar i{display:block;height:1px;width:0;background:var(--fg);transition:width .15s linear}
    #vx-dbg{position:fixed;left:18px;bottom:52px;z-index:12;display:none;white-space:pre;
            padding:9px 12px;font:300 10px/1.7 var(--mono);letter-spacing:.06em;color:var(--t2)}
    body.vxdbg #vx-dbg{display:block}

    /* --- música (musica.js) --- */
    #vmus{position:fixed;right:18px;bottom:22px;z-index:12;display:flex;align-items:center;gap:9px;
          padding:8px 12px;cursor:pointer;user-select:none;transition:opacity .4s}
    #vmus .dot{width:5px;height:5px;border-radius:50%;background:var(--fg);flex:none;
               transition:background .5s,box-shadow .5s}
    #vmus .txt{font:400 10px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--t2)}
    #vmus:hover .txt{color:var(--t1)}
    #vmus.off .dot{background:transparent;box-shadow:inset 0 0 0 1px var(--line2)}
    #vmus-d{position:fixed;right:18px;bottom:58px;z-index:12;display:none;white-space:pre;
            padding:9px 12px;font:300 10px/1.7 var(--mono);letter-spacing:.06em;color:var(--t2)}
    body.vmusd #vmus-d{display:block}

    /* --- Kinect (kinect_bridge.js) --- */
    .vk-hud{position:fixed;left:18px;bottom:22px;z-index:10;padding:8px 12px;
            font:400 10px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--t2)}
    .vk-hud b{color:var(--t1);font-weight:400}
    .vk-prev{position:fixed;left:18px;top:52px;width:220px;z-index:8;display:none;overflow:hidden}
    .vk-prev img{display:block;width:100%;height:165px;object-fit:cover;opacity:.75}
    .vk-map{position:fixed;left:18px;top:52px;width:220px;height:165px;z-index:9;pointer-events:none}
    .vk-tab{position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:21;cursor:pointer;
            background:var(--panel);border:1px solid var(--line);border-right:0;padding:16px 9px;
            font:400 9px var(--mono);letter-spacing:.3em;text-transform:uppercase;color:var(--t2);
            writing-mode:vertical-rl;user-select:none;transition:color .25s,border-color .25s,right .4s cubic-bezier(.3,.9,.3,1)}
    .vk-tab:hover{color:var(--fg);border-color:var(--line2)}
    .vk-panel{position:fixed;right:0;top:50%;transform:translate(100%,-50%);z-index:20;width:286px;
              max-height:84vh;overflow:auto;border-right:0;padding:18px 18px 20px;
              transition:transform .45s cubic-bezier(.3,.9,.3,1)}
    .vk-panel.open{transform:translate(0,-50%)}
    .vk-panel h3{margin:0 0 16px;font:400 10px var(--mono);letter-spacing:.3em;text-transform:uppercase;color:var(--t2)}
    .vk-row{margin:13px 0}
    .vk-row label{display:flex;justify-content:space-between;font:400 10px var(--mono);
                  letter-spacing:.1em;text-transform:uppercase;color:var(--t2);margin-bottom:7px}
    .vk-row b{color:var(--t1);font-weight:400}
    .vk-row input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:12px;background:transparent;cursor:pointer}
    .vk-row input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--line2)}
    .vk-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:8px;height:8px;
            border-radius:50%;background:var(--fg);margin-top:-3.5px}
    .vk-row input[type=range]::-moz-range-track{height:1px;background:var(--line2)}
    .vk-row input[type=range]::-moz-range-thumb{width:8px;height:8px;border:0;border-radius:50%;background:var(--fg)}
    .vk-chk{display:flex;align-items:center;gap:9px;margin:11px 0;cursor:pointer;
            font:400 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--t2)}
    .vk-chk:hover{color:var(--t1)}
    .vk-chk input{-webkit-appearance:none;appearance:none;width:11px;height:11px;border:1px solid var(--line2);
                  background:transparent;cursor:pointer;flex:none;position:relative}
    .vk-chk input:checked{background:var(--fg);border-color:var(--fg)}
    .vk-btn{margin-top:18px;width:100%;padding:10px;font:400 10px var(--mono);letter-spacing:.2em;
            text-transform:uppercase;color:var(--t2);background:transparent;border:1px solid var(--line);
            cursor:pointer;transition:color .25s,border-color .25s}
    .vk-btn:hover{color:var(--fg);border-color:var(--line2)}
    .vk-shots{position:fixed;right:18px;top:16px;display:flex;flex-direction:column;gap:9px;z-index:10}
    .vk-shots a{display:block;border:1px solid var(--line);overflow:hidden;opacity:.8;transition:opacity .25s,border-color .25s}
    .vk-shots a:hover{opacity:1;border-color:var(--line2)}
    .vk-shots img{display:block;max-width:168px;max-height:118px}
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <script src="coso.js" type="module"></script>
    <!-- música según el gas. Script normal (no módulo) y con ?v= para que Chrome no lo cachee. -->
    <script src="musica.js?v=6"></script>
</body>
</html>
